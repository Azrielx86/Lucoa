[package]
name = "lucoa"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
# The TUI owns stdout; a stray print corrupts the screen.
print_stdout = "warn"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
notify = "8"
regex = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memchr = "2"
unicode-width = "0.2"
arboard = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
# Arithmetic overflow is a logic bug even in release; the cost is negligible here.
overflow-checks = true
